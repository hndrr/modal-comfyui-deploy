name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      # PRs use the files API; main pushes compare against the previous push.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            python:
              - '.github/workflows/tests.yml'
              - '**/*.py'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - 'comfy_split/extension_paths.yaml'
              - 'extensions/**/web/**'
              - 'scripts/modal.sh'
            web:
              - '.github/workflows/tests.yml'
              - 'web/**'
              - 'asset_manager.py'
              - 'asset_rpc.py'
              - 'preserve_model.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
            worker:
              - '.github/workflows/tests.yml'
              - 'worker/**'

  # Keep the existing check names. If detection fails, run all tests rather than
  # silently skipping checks that may be required by branch protection.
  python:
    name: Python tests
    needs: changes
    if: >-
      ${{ !cancelled() && (needs.changes.result != 'success' ||
          github.event_name == 'workflow_dispatch' ||
          needs.changes.outputs.python == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.26"
          python-version: "3.12"
          enable-cache: true
      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: uv sync --locked --extra ambient-test
      - name: Run unit and regression tests
        run: uv run --locked --extra ambient-test python -m unittest discover -s tests -v

  web:
    name: Asset manager tests and build
    needs: changes
    if: >-
      ${{ !cancelled() && (needs.changes.result != 'success' ||
          github.event_name == 'workflow_dispatch' ||
          needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  worker:
    name: Access proxy tests and typecheck
    needs: changes
    if: >-
      ${{ !cancelled() && (needs.changes.result != 'success' ||
          github.event_name == 'workflow_dispatch' ||
          needs.changes.outputs.worker == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
